<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

  <!--  font awsome icons -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicyg="no-referrer">

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">



  <title th:text=${title}>Home Page</title>

  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", "xwop2af21g");
  </script>
</head>

<body>

  <!-- start of navbar -->

  <nav class="navbar navbar-expand-lg navbar-light navbar-fixed-top" style="background-color :#c5a059;">
    <div class="container-fluid">

      <a class="navbar-brand" th:href="@{/}" href="#">InDoc</a>

      <button id="feedback-btn" class="nav-btn mx-auto mx-lg-3 order-0 order-lg-2"
        style="cursor: pointer; background-color: #0056b3; color: white; padding: 6px 12px; border-radius: 5px; border: none; font-size: 0.85rem;">What
        YOU want</button>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse w-100 w-lg-auto order-3 order-lg-1" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">

          <li class="nav-item active">
            <a class="nav-link" th:href="@{/service}" href="/service.html">Service<span
                class="sr-only">(current)</span></a>
          </li>



          <li class="nav-item">
            <a class="nav-link" th:href="@{/contact}" href="#">Contact Us</a>
          </li>



        </ul>

        <ul class="navbar-nav ml-auto">

          <li class="nav-item">
            <a class="nav-link" th:href="@{/login}" href="#">Login</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" th:href="@{/signin}" href="#">Signin</a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- end of navbar -->

  <div th:replace="${content}"></div>

  <!-- Optional JavaScript -->
  <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
    integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>

  <!-- script for tally FEEDBACK form -->
  <script async src="https://tally.so/widgets/embed.js"></script>

  <script>
    document.getElementById('feedback-btn').addEventListener('click', function () {

      // Get the exact URL the user is currently on
      const currentPageUrl = window.location.href;

      // Open the Tally popup 
      Tally.openPopup('1AzqvL', {
        layout: 'modal',
        width: 500,
        hiddenFields: {
          current_page: currentPageUrl // Passes the URL to your hidden field
        }
      });
    });
  </script>
</body>

</html>
